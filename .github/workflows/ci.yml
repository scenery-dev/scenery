# ci.yml — Scenery runner CI
#
# fmt + clippy + unit tests + dependency audits. Runs on every push / PR and is
# reusable (workflow_call) so release.yml gates the build on it.
#
# Every third-party action is pinned to a full commit SHA (version in the
# trailing comment). The Rust toolchain comes from rust-toolchain.toml (an
# exact 1.N.0), installed with rustup, not a moving `stable` action.
#
# Tests run SINGLE-THREADED: several daemon tests mutate process-global env
# vars (HOME, SCENERY_DISABLE_FILESYSTEM_RECONCILER) that production code
# reads, so they race under the default parallel test runner.
# SCENERY_DISABLE_KEYCHAIN=1 keeps auth-token tests off any real keychain.

name: ci

on:
  workflow_call:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCENERY_DISABLE_KEYCHAIN: "1"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --all -- --check

      # Lint lib + bin targets (not --all-targets: test targets carry a
      # pre-existing unused-import warning that would trip -D warnings).
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --locked -- -D warnings

      # --lib only: integration tests under tests/ are environment-heavy
      # (acceptance scripts, sockets, ports) and run on the dedicated test box.
      - name: Unit tests
        run: cargo test --workspace --lib --locked -- --test-threads=1

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit
        # Keep this ignore list in sync with deny.toml (residuals that need a
        # Cargo.toml bump in crates/; see deny.toml for the reasons).
        run: >
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0387
          --ignore RUSTSEC-2026-0258
          --ignore RUSTSEC-2024-0449

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: cargo deny
        run: cargo deny --locked check advisories bans sources
