name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Releases are created as DRAFTS. scripts/sign-release.sh (run on the owner's
# Mac) verifies the build provenance, minisign-signs SHA256SUMS with the
# offline key, uploads the .minisig and publishes the draft.

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          # x86_64-apple-darwin: cross-compiled from macos-15 (arm64 host) via Xcode universal SDK
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install pinned rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show

      - name: cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: build release binaries
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: strip binary (macOS)
        if: runner.os == 'macOS'
        run: |
          strip target/${{ matrix.target }}/release/scenery

      - name: strip binary (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/${{ matrix.target }}/release/scenery

      - name: package tarball
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TRIPLE="${{ matrix.target }}"
          ARCHIVE_NAME="scenery-${VERSION}-${TRIPLE}.tar.gz"

          STAGING_DIR="$(mktemp -d)"
          PKG_DIR="${STAGING_DIR}/scenery-${VERSION}-${TRIPLE}"
          mkdir -p "${PKG_DIR}"

          cp target/${TRIPLE}/release/scenery "${PKG_DIR}/"
          # `scn` is a short alias: a symlink to `scenery` inside the archive.
          ln -s scenery "${PKG_DIR}/scn"
          cp LICENSE "${PKG_DIR}/"
          cp README.md "${PKG_DIR}/"

          tar -czf "${ARCHIVE_NAME}" -C "${STAGING_DIR}" "scenery-${VERSION}-${TRIPLE}"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "${GITHUB_ENV}"

      - name: upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  release:
    name: publish draft release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          find . -type f | sort

      - name: attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS

      # Draft only. Publishing happens in scripts/sign-release.sh after the
      # SHA256SUMS.minisig is attached.
      - name: create draft github release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --draft --generate-notes --verify-tag ${flags} \
            artifacts/*.tar.gz artifacts/SHA256SUMS
