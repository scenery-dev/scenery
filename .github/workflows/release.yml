name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Releases are created as DRAFTS. scripts/sign-release.sh (run on the owner's
# Mac) verifies the build provenance, minisign-signs SHA256SUMS with the
# offline key, uploads the .minisig and publishes the draft.

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          # x86_64-apple-darwin: cross-compiled from macos-15 (arm64 host) via Xcode universal SDK
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install pinned rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show

      - name: cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: build release binaries
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: strip binary (macOS)
        if: runner.os == 'macOS'
        run: |
          strip target/${{ matrix.target }}/release/scenery

      - name: strip binary (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/${{ matrix.target }}/release/scenery

      - name: package tarball
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TRIPLE="${{ matrix.target }}"
          ARCHIVE_NAME="scenery-${VERSION}-${TRIPLE}.tar.gz"

          STAGING_DIR="$(mktemp -d)"
          PKG_DIR="${STAGING_DIR}/scenery-${VERSION}-${TRIPLE}"
          mkdir -p "${PKG_DIR}"

          cp target/${TRIPLE}/release/scenery "${PKG_DIR}/"
          # `scn` is a short alias: a symlink to `scenery` inside the archive.
          ln -s scenery "${PKG_DIR}/scn"
          cp LICENSE "${PKG_DIR}/"
          cp README.md "${PKG_DIR}/"

          tar -czf "${ARCHIVE_NAME}" -C "${STAGING_DIR}" "scenery-${VERSION}-${TRIPLE}"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "${GITHUB_ENV}"

      - name: upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  pkg:
    name: macOS pkg
    needs: build
    runs-on: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: download mac tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: scenery-*-apple-darwin.tar.gz
          path: mac/
          merge-multiple: true

      - name: extract mac binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "${RUNNER_TEMP}/bin"
          for arch in aarch64 x86_64; do
            triple="${arch}-apple-darwin"
            tar -xzf "mac/scenery-${VERSION}-${triple}.tar.gz" -C "${RUNNER_TEMP}" \
              "scenery-${VERSION}-${triple}/scenery"
            mv "${RUNNER_TEMP}/scenery-${VERSION}-${triple}/scenery" "${RUNNER_TEMP}/bin/scenery-${arch}"
          done
          ls -l "${RUNNER_TEMP}/bin"

      - name: detect Apple secrets
        id: apple
        env:
          APPLE_DEVELOPER_ID_APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set=0
          for v in "${APPLE_DEVELOPER_ID_APP_P12}" "${APPLE_DEVELOPER_ID_INSTALLER_P12}" \
            "${APPLE_P12_PASSWORD}" "${APPLE_NOTARY_KEY_P8}" \
            "${APPLE_NOTARY_KEY_ID}" "${APPLE_NOTARY_ISSUER_ID}"; do
            if [ -n "${v}" ]; then set=$((set + 1)); fi
          done
          if [ "${set}" -eq 6 ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            if [ "${set}" -gt 0 ]; then
              echo "::warning::Only ${set} of 6 Apple signing secrets are set; building an UNSIGNED pkg"
            fi
            echo "pkg: unsigned (no Apple secrets)"
          fi

      # Signing approach: CI imports the certs and codesigns both binaries
      # (hardened runtime + timestamp) BEFORE packaging; build-pkg.sh then only
      # needs APP_SIGN_ID/INSTALLER_SIGN_ID to productsign the pkg.
      - name: import signing certificates
        if: steps.apple.outputs.enabled == 'true'
        env:
          APPLE_DEVELOPER_ID_APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/scenery-build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "::add-mask::${KEYCHAIN_PW}"
          echo "${APPLE_DEVELOPER_ID_APP_P12}" | base64 --decode > "${RUNNER_TEMP}/app.p12"
          echo "${APPLE_DEVELOPER_ID_INSTALLER_P12}" | base64 --decode > "${RUNNER_TEMP}/installer.p12"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          for p12 in app installer; do
            security import "${RUNNER_TEMP}/${p12}.p12" -k "${KEYCHAIN}" -P "${APPLE_P12_PASSWORD}" \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PW}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db
          APP_ID="$(security find-identity -v -p codesigning "${KEYCHAIN}" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          INSTALLER_ID="$(security find-identity -v "${KEYCHAIN}" | awk -F'"' '/Developer ID Installer/ {print $2; exit}')"
          [ -n "${APP_ID}" ] && [ -n "${INSTALLER_ID}" ] || { echo "signing identities not found" >&2; exit 1; }
          {
            echo "APP_SIGN_ID=${APP_ID}"
            echo "INSTALLER_SIGN_ID=${INSTALLER_ID}"
            echo "SCENERY_KEYCHAIN=${KEYCHAIN}"
          } >> "${GITHUB_ENV}"
          rm -f "${RUNNER_TEMP}/app.p12" "${RUNNER_TEMP}/installer.p12"

      - name: codesign binaries
        if: steps.apple.outputs.enabled == 'true'
        run: |
          for arch in aarch64 x86_64; do
            codesign --force --options runtime --timestamp -s "${APP_SIGN_ID}" "${RUNNER_TEMP}/bin/scenery-${arch}"
            codesign --verify --strict "${RUNNER_TEMP}/bin/scenery-${arch}"
          done

      - name: build pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg-out
          if [ "${{ steps.apple.outputs.enabled }}" = "true" ]; then
            export SCENERY_PKG_SIGN=1
          fi
          scripts/build-pkg.sh --flavor prod "${VERSION}" \
            "${RUNNER_TEMP}/bin/scenery-aarch64" "${RUNNER_TEMP}/bin/scenery-x86_64" pkg-out
          ls -l pkg-out

      - name: notarize and staple
        if: steps.apple.outputs.enabled == 'true'
        env:
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="pkg-out/scenery-${VERSION}-macos.pkg"
          # APPLE_NOTARY_KEY_P8 holds the base64 of the .p8 file.
          echo "${APPLE_NOTARY_KEY_P8}" | base64 --decode > "${RUNNER_TEMP}/notary.p8"
          xcrun notarytool submit "${PKG}" --wait \
            --key "${RUNNER_TEMP}/notary.p8" --key-id "${APPLE_NOTARY_KEY_ID}" --issuer "${APPLE_NOTARY_ISSUER_ID}"
          xcrun stapler staple "${PKG}"
          xcrun stapler validate "${PKG}"

      - name: cleanup signing material
        if: always()
        run: |
          if [ -n "${SCENERY_KEYCHAIN:-}" ]; then
            security delete-keychain "${SCENERY_KEYCHAIN}" || true
          fi
          rm -f "${RUNNER_TEMP}/app.p12" "${RUNNER_TEMP}/installer.p12" "${RUNNER_TEMP}/notary.p8"

      - name: upload pkg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenery-pkg
          path: pkg-out/scenery-*-macos.pkg
          if-no-files-found: error

  release:
    name: publish draft release
    needs: [build, pkg]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Checkout first: it cleans the workspace, so it must run before the
      # artifacts are downloaded. Only the two scan scripts are needed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/scan.sh
            scripts/scan-mdm.sh
          sparse-checkout-cone-mode: false

      - name: download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/
          merge-multiple: true

      # scan.sh and scan-mdm.sh are release assets listed in SHA256SUMS (which
      # sign-release.sh minisign-signs): scan-mdm.sh fetches scan.sh by tag and
      # verifies it, and MDM admins verify scan-mdm.sh the same way.
      - name: add scan scripts
        run: cp scripts/scan.sh scripts/scan-mdm.sh artifacts/

      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum -- *.tar.gz *.pkg scan.sh scan-mdm.sh > SHA256SUMS
          cat SHA256SUMS
          find . -type f | sort

      - name: attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.pkg
            artifacts/scan.sh
            artifacts/scan-mdm.sh
            artifacts/SHA256SUMS

      # Draft only. Publishing happens in scripts/sign-release.sh after the
      # SHA256SUMS.minisig is attached.
      - name: create draft github release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --draft --generate-notes --verify-tag ${flags} \
            artifacts/*.tar.gz artifacts/*.pkg artifacts/scan.sh artifacts/scan-mdm.sh artifacts/SHA256SUMS
